<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Better SGY — the friendly one</title>
<style>
  /* ============================================================
     "A friend who has too much to say."
     Warm cream paper · rounded type · speech bubbles · margin notes.
     The grades are the facts; the friend is the voice all over them.
     One rounded component system, reused on every screen.
     Now driven by vanilla JS off MOCKUP_DATA. Works on double-click.
     ============================================================ */
  :root{
    --paper:   #fdf4e6;
    --paper-2: #f7ead6;
    --card:    #fffdf9;
    --ink:     #3a2f25;
    --ink-2:   #8a7a66;
    --ink-3:   #b6a690;
    --line:    #ece0cd;
    --coral:   #ff6f61;
    --peach:   #ffb454;
    --sun:     #ffcf4d;
    --sage:    #4fb286;
    --sky:     #5aa9e6;
    --grape:   #9b87f2;
    --rose:    #ef6a52;
    --bubble:  #fff4dd;
    --softfill:#fff1d6;   /* generic soft chip/emoji fill */
    --bubble-tail:#fff4dd;
    --grid:    #ece0cd;
    --shadow:  rgba(120,80,30,.5);
    --glow-a:  rgba(255,180,84,.10);
    --glow-b:  rgba(155,135,242,.10);
    --font: "SF Pro Rounded","ui-rounded","Hiragino Maru Gothic ProN",
            "Segoe UI Variable","Nunito",system-ui,-apple-system,sans-serif;
  }

  /* ---- DARK (warm cocoa paper, not cold) ---- */
  html[data-theme="dark"]{
    --paper:   #241c15;
    --paper-2: #322619;
    --card:    #2e241a;
    --ink:     #f3e6d3;
    --ink-2:   #c2ac90;
    --ink-3:   #8f7a60;
    --line:    #463728;
    --bubble:  #3a2c1c;
    --bubble-tail:#3a2c1c;
    --softfill:#3d2f1e;
    --grid:    #443524;
    --shadow:  rgba(0,0,0,.55);
    --glow-a:  rgba(255,180,84,.07);
    --glow-b:  rgba(155,135,242,.06);
  }
  /* dark: warm up the hardcoded pastel fills so nothing reads cold/white */
  html[data-theme="dark"] .chip .ic.a{background:#1f3a2c}
  html[data-theme="dark"] .chip .ic.b{background:#3d2f1a}
  html[data-theme="dark"] .chip .ic.c{background:#3d241e}
  html[data-theme="dark"] .chip .ic.d{background:#2c2742}
  html[data-theme="dark"] .missrow td{background:#3a241c}
  html[data-theme="dark"] .stat.urgent{background:#3d241e;color:#ff9b87}
  html[data-theme="dark"] .stat.soon{background:#3d2f1a;color:#e6b96a}
  html[data-theme="dark"] .stat.ok{background:#1f3a2c;color:#7cd0a7}
  html[data-theme="dark"] .sticky{background:#3a2f17;border-color:#5a4a22}
  html[data-theme="dark"] .sticky p{color:#e9d29a}
  html[data-theme="dark"] .day.sel{background:#3a2c1c}
  html[data-theme="dark"] .file .fi.folder{background:#3d2f1a}
  html[data-theme="dark"] .file .fi.pdf{background:#3d241e}
  html[data-theme="dark"] .file .fi.link{background:#22344a}
  html[data-theme="dark"] .file .fi.doc{background:#1f3a2c}
  html[data-theme="dark"] .detected .glob{background:#1f3a2c}
  html[data-theme="dark"] .toast .ti{background:var(--paper-2)}
  html[data-theme="dark"] .sidefoot{border-color:#5a4a2e}
  html[data-theme="dark"] .outro{border-color:#5a4a2e}
  html[data-theme="dark"] .sechd .miss,html[data-theme="dark"] .miss{color:#ff8a72}
  html[data-theme="dark"] .stylecard.on{background:#3a2c1c}
  html[data-theme="dark"] .day.today .dn{color:var(--coral)}

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font);background:var(--paper);color:var(--ink);
    line-height:1.5;-webkit-font-smoothing:antialiased;
    transition:background-color .25s ease,color .25s ease;
    background-image:radial-gradient(circle at 12% 8%,var(--glow-a),transparent 38%),
                     radial-gradient(circle at 90% 0%,var(--glow-b),transparent 36%);
  }

  /* highlighter + wave (shared) */
  .hl{background:linear-gradient(transparent 62%,rgba(255,207,77,.55) 62%);padding:0 1px}
  .wave{text-decoration:underline wavy var(--peach);text-underline-offset:3px;text-decoration-thickness:1.5px}
  .miss{color:var(--rose);font-weight:800}
  .up{color:var(--sage);font-weight:800}

  /* ============================================================
     APP SHELL — sidebar + screen area
     ============================================================ */
  .app{display:flex;min-height:100vh;max-width:1180px;margin:0 auto;gap:22px;padding:24px 20px 60px}

  /* ---- sidebar ---- */
  .side{flex:none;width:236px;position:sticky;top:24px;align-self:flex-start;
        background:var(--card);border:1.5px solid var(--line);border-radius:26px;
        padding:18px 14px;box-shadow:0 12px 30px -20px rgba(120,80,30,.5)}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
  .brand .ava{width:42px;height:42px;border-radius:50%;flex:none;
       background:radial-gradient(circle at 35% 30%,#ffd98a,#ff9d5c);
       box-shadow:0 4px 0 rgba(214,140,70,.25);display:grid;place-items:center;font-size:20px}
  .brand .nm{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
  .brand .sub{font-size:11.5px;color:var(--ink-2);font-weight:600}

  .nav{display:flex;flex-direction:column;gap:3px}
  .nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:16px;
        font-size:14.5px;font-weight:700;color:var(--ink-2);cursor:pointer;font-family:inherit;
        background:none;border:none;text-align:left;width:100%;
        transition:background .12s,color .12s;user-select:none}
  .nav button .ni{width:28px;height:28px;border-radius:10px;flex:none;display:grid;place-items:center;
        font-size:15px;background:var(--paper-2);transition:background .12s}
  .nav button:hover{background:var(--paper-2);color:var(--ink)}
  .nav button.active{background:var(--ink);color:#fff;box-shadow:0 8px 18px -10px rgba(58,47,37,.6)}
  .nav button.active .ni{background:rgba(255,255,255,.18)}

  .sidefoot{margin-top:16px;padding:12px;border-radius:18px;background:var(--paper-2);
        border:1.5px dashed #e3d2b6}
  .sidefoot p{font-size:12.5px;font-weight:700;color:var(--ink)}
  .sidefoot p span{color:var(--ink-2);font-weight:600}

  /* ---- screen area ---- */
  .main{flex:1;min-width:0}
  .screen{display:none}
  .screen.show{display:block;animation:fade .26s cubic-bezier(.2,.8,.2,1)}
  @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  /* ============================================================
     SHARED COMPONENTS
     ============================================================ */
  .pagehd{display:flex;align-items:flex-end;gap:12px;margin-bottom:4px;flex-wrap:wrap}
  .pagehd h1{font-size:25px;font-weight:800;letter-spacing:-.015em}
  .pagehd .when{font-size:13px;color:var(--ink-2);font-weight:600}
  .lead{font-size:14.5px;color:var(--ink-2);font-weight:600;margin:8px 0 18px}

  .bubble{position:relative;background:var(--bubble);border:1.5px solid var(--line);
        border-radius:22px;padding:14px 17px;font-size:15.5px;font-weight:600;
        box-shadow:0 8px 20px -14px rgba(120,80,30,.5)}
  .bubble.tail:before{content:"";position:absolute;left:-9px;top:22px;width:18px;height:18px;
        background:var(--bubble-tail);border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);
        transform:rotate(45deg)}
  .bubble.small{font-size:13.5px;font-weight:600;color:var(--ink-2)}

  .card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;
        box-shadow:0 8px 20px -16px rgba(120,80,30,.5)}

  .sechd{margin:30px 0 4px;display:flex;align-items:baseline;gap:10px}
  .sechd h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .sechd .sub{font-size:13px;color:var(--ink-2);font-weight:600}

  /* course card (shared from anchor) */
  .course{background:var(--card);border:1.5px solid var(--line);border-radius:22px;
        padding:16px 18px;margin-bottom:14px;box-shadow:0 8px 20px -16px rgba(120,80,30,.5);
        position:relative;overflow:hidden;cursor:pointer;
        transition:transform .14s cubic-bezier(.2,.8,.2,1),box-shadow .14s}
  .course:hover{transform:translateY(-2px);box-shadow:0 14px 26px -16px rgba(120,80,30,.55)}
  .course:active{transform:translateY(0)}
  .course:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--dot,var(--peach))}
  .crow{display:flex;align-items:center;gap:14px}
  .emoji{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:21px;
        background:var(--soft,var(--softfill))}
  .cmeta{flex:1;min-width:0}
  .cmeta .nm{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.25;margin-bottom:3px}
  .cmeta .tc{font-size:13px;color:var(--ink-2);font-weight:600;line-height:1.3}
  .grade{display:flex;flex-direction:column;align-items:flex-end;flex:none}
  .grade .g{font-size:24px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .grade .g .pct{font-size:13px;color:var(--ink-3);font-weight:700}
  .grade .lt{font-size:12px;font-weight:800;color:var(--ink-2);margin-top:3px}
  .spark{flex:none;margin-left:2px}

  .say{margin-top:12px;display:flex;gap:9px;align-items:flex-start}
  .say .q{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;
        background:var(--soft,var(--softfill))}
  .say p{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.45}
  .say .add{display:block;margin-top:5px;font-size:13.5px;color:var(--ink-2);font-weight:600}

  /* pill / chip */
  .tagpill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;
        padding:4px 11px;border-radius:20px;background:var(--paper-2);color:var(--ink-2)}
  .tagpill .dot{width:8px;height:8px;border-radius:50%;background:var(--dot,var(--peach))}

  /* ============================================================
     OVERVIEW
     ============================================================ */
  .hello{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .hello h1{font-size:25px;font-weight:800;letter-spacing:-.01em}
  .hello .when{font-size:13.5px;color:var(--ink-2);font-weight:600;margin-top:1px}
  .hero{display:flex;gap:18px;align-items:flex-start;margin-top:20px;flex-wrap:wrap}
  .score{background:var(--card);border:1.5px solid var(--line);border-radius:26px;
         padding:20px 26px 18px;box-shadow:0 10px 24px -14px rgba(120,80,30,.45);position:relative;flex:none}
  .score .big{font-size:58px;font-weight:800;line-height:1;letter-spacing:-.03em}
  .score .big .pct{font-size:24px;color:var(--ink-3)}
  .score .cap{font-size:13px;color:var(--ink-2);font-weight:700;margin-top:6px}
  .score .tag{position:absolute;top:-12px;right:-10px;background:var(--sage);color:#fff;
        font-size:12px;font-weight:800;padding:4px 12px;border-radius:20px;
        box-shadow:0 5px 12px -3px rgba(79,178,134,.6);transform:rotate(4deg)}
  .herobub{max-width:380px}
  .herobub .bubble{margin-bottom:9px}
  .gist{margin-top:24px;display:flex;flex-wrap:wrap;gap:11px}
  .chip{background:var(--card);border:1.5px solid var(--line);border-radius:18px;
        padding:11px 15px;display:flex;align-items:center;gap:11px;box-shadow:0 6px 16px -14px rgba(120,80,30,.5)}
  .chip .ic{width:34px;height:34px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:17px}
  .chip .ic.a{background:#eafaf2} .chip .ic.b{background:#fff1d6}
  .chip .ic.c{background:#ffe6e0} .chip .ic.d{background:#ece7ff}
  .chip .n{font-size:18px;font-weight:800;line-height:1}
  .chip .l{font-size:12px;color:var(--ink-2);font-weight:600}
  .outro{margin-top:28px;background:var(--paper-2);border:1.5px dashed #e3d2b6;border-radius:22px;
        padding:18px 20px;display:flex;gap:13px;align-items:center}
  .outro .ic{font-size:26px}
  .outro p{font-size:15px;font-weight:700;color:var(--ink)}
  .outro p span{color:var(--ink-2);font-weight:600}

  /* ============================================================
     LINE CHART (shared) — warm, rounded, soft gridlines
     ============================================================ */
  .chartcard{padding:18px 20px 16px;margin-top:20px}
  .chartcard .chd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .chartcard .chd .ct{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .chartcard .chd .cs{font-size:12.5px;color:var(--ink-2);font-weight:600}
  .chartwrap{width:100%;position:relative}
  .chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
  .ax{font-size:10px;font-weight:700;fill:var(--ink-3)}
  .axy{font-size:9.5px;font-weight:700;fill:var(--ink-3)}
  .grid{stroke:var(--grid);stroke-width:1}
  .endlabel{font-size:11px;font-weight:800;fill:var(--ink)}
  .hoverpt{cursor:pointer;transition:r .1s}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .lchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;
        padding:5px 11px;border-radius:16px;background:var(--paper-2);color:var(--ink-2);cursor:pointer;
        user-select:none;transition:background .12s,color .12s,opacity .12s}
  .lchip.on{background:var(--paper-2);color:var(--ink-2)}
  .lchip.on.sel{background:var(--ink);color:#fff}
  .lchip.off{opacity:.4}
  .lchip.sel .dot{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--dot)}
  .lchip .dot{width:9px;height:9px;border-radius:50%;background:var(--dot,var(--peach))}
  .charttip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:11.5px;
        font-weight:800;padding:5px 9px;border-radius:11px;white-space:nowrap;opacity:0;transform:translateX(-50%);
        transition:opacity .1s;box-shadow:0 8px 18px -8px rgba(58,47,37,.6);z-index:5}

  /* ============================================================
     GRADES
     ============================================================ */
  .classpick{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
  .ctab{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:16px;
        border:1.5px solid var(--line);background:var(--card);font-size:13.5px;font-weight:700;
        color:var(--ink-2);cursor:pointer;box-shadow:0 5px 14px -14px rgba(120,80,30,.5);
        transition:transform .12s,background .12s,color .12s,border-color .12s}
  .ctab:hover{transform:translateY(-1px)}
  .ctab .dot{width:9px;height:9px;border-radius:50%;background:var(--dot)}
  .ctab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .gradehero{display:flex;gap:16px;align-items:center;padding:18px 20px;margin-bottom:6px}
  .gradehero .emoji{width:54px;height:54px;border-radius:16px;font-size:26px}
  .gradehero .gh-meta{flex:1;min-width:0}
  .gradehero .gh-meta .nm{font-size:20px;font-weight:800;line-height:1.25;margin-bottom:3px}
  .gradehero .gh-meta .tc{font-size:13.5px;color:var(--ink-2);font-weight:600;line-height:1.3}
  .gradehero .gh-g{text-align:right;flex:none}
  .gradehero .gh-g .g{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .gradehero .gh-g .g .pct{font-size:16px;color:var(--ink-3)}
  .gradehero .gh-g .lt{font-size:13px;font-weight:800;color:var(--ink-2)}

  .cats{display:flex;flex-direction:column;gap:10px;margin:18px 0 8px}
  .cat{display:flex;align-items:center;gap:14px;padding:13px 16px}
  .cat .cn{font-size:15px;font-weight:800;width:130px;flex:none}
  .cat .wt{font-size:12px;font-weight:700;color:var(--ink-2);flex:none;width:64px}
  .cat .bar{flex:1;height:9px;border-radius:6px;background:var(--paper-2);overflow:hidden}
  .cat .bar i{display:block;height:100%;border-radius:6px;background:var(--dot,var(--sage));width:0;
        transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .cat .av{font-size:15px;font-weight:800;flex:none;width:58px;text-align:right}

  table.asg{width:100%;border-collapse:collapse}
  table.asg th{text-align:left;font-size:11.5px;font-weight:800;color:var(--ink-2);
        text-transform:uppercase;letter-spacing:.04em;padding:10px 16px;border-bottom:1.5px solid var(--line)}
  table.asg th.r,table.asg td.r{text-align:right}
  table.asg td{padding:13px 16px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line)}
  table.asg tr:last-child td{border-bottom:none}
  table.asg .anm{font-weight:800;color:var(--ink)}
  table.asg .adt{font-size:12.5px;color:var(--ink-2);font-weight:600}
  table.asg .pc{font-weight:800}
  .missrow td{background:#fff3ee}
  .missbadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#fff;
        background:var(--rose);padding:3px 9px;border-radius:14px}

  /* ============================================================
     ASSIGNMENTS
     ============================================================ */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 8px}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;padding:11px 15px;
        border-radius:18px;border:1.5px solid var(--line);background:var(--card);
        box-shadow:0 5px 14px -14px rgba(120,80,30,.5)}
  .search input{border:none;background:none;outline:none;font:inherit;font-size:14.5px;font-weight:600;
        color:var(--ink);flex:1}
  .search input::placeholder{color:var(--ink-3)}
  .tabs{display:flex;gap:6px;background:var(--paper-2);padding:5px;border-radius:18px}
  .tabs button{padding:8px 16px;border-radius:14px;font-size:13.5px;font-weight:800;color:var(--ink-2);
        cursor:pointer;user-select:none;border:none;background:none;font-family:inherit}
  .tabs button .ct{font-size:11px;color:var(--ink-3);font-weight:800}
  .tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 4px 10px -6px rgba(120,80,30,.5)}
  .tabs button.on .ct{color:var(--ink-2)}

  .todo{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:11px;position:relative;overflow:hidden;
        transition:transform .14s cubic-bezier(.2,.8,.2,1),opacity .25s}
  .todo:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--dot,var(--peach))}
  .todo .box{width:22px;height:22px;border-radius:8px;border:2px solid var(--ink-3);flex:none;cursor:pointer;
        display:grid;place-items:center;transition:background .15s,border-color .15s,transform .12s}
  .todo .box:hover{transform:scale(1.08)}
  .todo .box.done{background:var(--sage);border-color:var(--sage)}
  .todo .tmeta{flex:1;min-width:0}
  .todo .tt{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .todo .tt.struck{text-decoration:line-through;color:var(--ink-3)}
  .todo .tsub{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:2px}
  .todo .tsub .aside{color:var(--rose);font-weight:700}
  .todo .tsub .aside.soft{color:var(--ink-2);font-style:italic;font-weight:600}
  .todo .due{font-size:12.5px;font-weight:800;color:var(--ink-2);flex:none;text-align:right}
  .due.today{color:var(--rose)}
  .stat{font-size:11px;font-weight:800;padding:4px 10px;border-radius:14px;flex:none}
  .stat.urgent{background:#ffe6e0;color:var(--rose)}
  .stat.soon{background:#fff1d6;color:#b5781f}
  .stat.ok{background:#eafaf2;color:#2f8a63}
  .emptynote{font-size:14px;color:var(--ink-2);font-weight:600;padding:24px 4px}

  /* ============================================================
     CALENDAR
     ============================================================ */
  .calbar{display:flex;align-items:center;gap:10px;margin:14px 0 16px;flex-wrap:wrap}
  .calbar .mo{font-size:19px;font-weight:800;letter-spacing:-.01em;min-width:150px}
  .navbtn{width:34px;height:34px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
        display:grid;place-items:center;cursor:pointer;font-size:15px;font-weight:800;color:var(--ink-2);
        box-shadow:0 5px 14px -14px rgba(120,80,30,.5);transition:transform .12s,background .12s}
  .navbtn:hover{transform:translateY(-1px);background:var(--paper-2)}
  .todaybtn{padding:8px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);
        font-size:13px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit;
        box-shadow:0 5px 14px -14px rgba(120,80,30,.5);transition:transform .12s,background .12s}
  .todaybtn:hover{transform:translateY(-1px);background:var(--paper-2)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .dow{font-size:11.5px;font-weight:800;color:var(--ink-2);text-align:center;padding:4px 0}

/* ---- THEME ENGINE: light / dark / auto + light paper tint ---- */
const PAPER_TINTS = {
  cream:{paper:'#fdf4e6',paper2:'#f7ead6',card:'#fffdf9'},
  oat:  {paper:'#f3ece1',paper2:'#e9dfcd',card:'#fbf7ef'},
  peach:{paper:'#ffeede',paper2:'#ffe2c9',card:'#fff8f1'},
  sage: {paper:'#eaf2ec',paper2:'#dde9df',card:'#f6fbf7'},
};
function prefersDark(){
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function effectiveDark(){
  if(state.themeMode==='dark') return true;
  if(state.themeMode==='light') return false;
  return prefersDark(); // auto
}
function applyTheme(){
  const root = document.documentElement;
  if(effectiveDark()){
    root.setAttribute('data-theme','dark');
    // dark owns its own palette — clear any light paper-tint overrides
    ['--paper','--paper-2','--card'].forEach(v => root.style.removeProperty(v));
  } else {
    root.removeAttribute('data-theme');
    const t = PAPER_TINTS[state.theme] || PAPER_TINTS.cream;
    root.style.setProperty('--paper', t.paper);
    root.style.setProperty('--paper-2', t.paper2);
    root.style.setProperty('--card', t.card);
  }
}
// auto mode reacts live to OS changes
if(window.matchMedia){
  try{
    window.matchMedia('(prefers-color-scheme: dark)')
      .addEventListener('change', () => { if(state.themeMode==='auto') applyTheme(); });
  }catch(e){}
}

function wireChartInteractions(wrapSel){
  const wrap = $(wrapSel); if(!wrap) return;
  const tip = $('#ctip', wrap) || $('#ctip');
  // legend toggles
  $$('#main .lchip').forEach(chip => chip.onclick = () => {
    const id = chip.dataset.line;
    const on = chip.classList.toggle('off');
    chip.classList.toggle('on', !on);
    $$(`[data-line="${id}"]`, wrap).forEach(el => el.style.display = on ? 'none' : '');
  });
  // hover points
  $$('.hoverpt', wrap).forEach(pt => {
    pt.addEventListener('mouseenter', () => {
      const cid = pt.dataset.line, i = +pt.dataset.i;
      pt.setAttribute('r','6'); pt.setAttribute('opacity','1');
      const v = HISTORY[cid][i];
      tip.textContent = `${WEEKS[i]} · ${v.toFixed(1)}%`;
      // position relative to wrap using svg coords
      const svg = $('svg', wrap);
      const box = svg.getBoundingClientRect();
      const wbox = wrap.getBoundingClientRect();
      const x = (+pt.getAttribute('cx'))/600 * box.width + (box.left - wbox.left);
      const y = (+pt.getAttribute('cy'))/220 * box.height + (box.top - wbox.top);
      tip.style.left = x + 'px';
      tip.style.top = (y - 34) + 'px';
      tip.style.transform = 'translateX(-50%)';
      tip.style.opacity = '1';
    });
    pt.addEventListener('mouseleave', () => {
      pt.setAttribute('r','4'); pt.setAttribute('opacity','0');
      tip.style.opacity = '0';
    });
  });
}

  const checked = !!state.asgDone[a.nm];
  const isDoneState = a.state==='done';
  const done = checked || isDoneState;
  let asideHtml = '';
  if(a.aside) asideHtml = ` <span class="aside">${esc(a.aside)}</span>`;
  else if(a.asideSoft) asideHtml = ` <span class="aside soft">${esc(a.asideSoft)}</span>`;
  const sub = done
    ? `${esc(c.name)} · ${esc(a.subInfo)}`
    : `${esc(c.name)} · ${esc(c.teacher)}${asideHtml}`;
  const right = done
    ? `<div class="stat ok">done</div>`
    : (a.dueLabel ? `<div class="due ${a.due==='today'?'today':''}">${esc(a.dueLabel)}</div>` : '') +
      `<div class="stat ${a.stat}">${esc(a.statLabel)}</div>`;
  return `<div class="card todo" data-nm="${esc(a.nm)}" style="--dot:${c.accent}">
    <div class="box ${done?'done':''}" data-check="${esc(a.nm)}">${done?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</div>
    <div class="tmeta"><div class="tt ${done?'struck':''}">${esc(a.nm)}</div><div class="tsub">${sub}</div></div>
    ${right}
  </div>`;
}
function viewAssign(){
  const c = counts();
  const tabBtn = (k,label,n) => `<button data-atab="${k}" class="${state.asgTab===k?'on':''}">${label} <span class="ct">${n}</span></button>`;
  return `
    <div class="pagehd"><h1>Assignments</h1><span class="when">your to-do, sorted by what matters</span></div>
    <p class="lead">2 due today, 2 you skipped. let's deal with those first.</p>
    <div class="toolbar">
      <div class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="#b6a690" stroke-width="2.2"/><path d="M20 20l-3.2-3.2" stroke="#b6a690" stroke-width="2.2" stroke-linecap="round"/></svg>
        <input type="text" id="asgsearch" placeholder="search assignments…" value="${esc(state.asgQuery)}">
      </div>
      <div class="tabs">${tabBtn('todo','To-do',c.todo)}${tabBtn('missing','Missing',c.missing)}${tabBtn('done','Done',c.done)}</div>
    </div>
    <div id="asglist"></div>`;
}
function renderAsgList(){
  const list = $('#asglist'); if(!list) return;
  const q = state.asgQuery.trim().toLowerCase();
  let items;
  if(state.asgTab==='todo') items = ASSIGNMENTS.filter(a => a.state==='todo' && !state.asgDone[a.nm]);
  else if(state.asgTab==='missing') items = ASSIGNMENTS.filter(a => a.state==='missing' && !state.asgDone[a.nm]);
  else items = ASSIGNMENTS.filter(a => a.state==='done' || state.asgDone[a.nm]);
  if(q) items = items.filter(a => a.nm.toLowerCase().includes(q) || byId(a.cid).name.toLowerCase().includes(q));
  let head = '';
  if(state.asgTab==='missing' && !q) head = `<div class="bubble tail small" style="margin-bottom:14px">both of these are small. an hour total, honestly, and the missing tag goes away 🧹</div>`;
  const body = items.length ? items.map(todoCard).join('')
    : `<div class="emptynote">${q ? 'nothing matches that. try a shorter word.' : state.asgTab==='missing' ? 'nothing missing. nice — you cleared them 🎉' : state.asgTab==='done' ? 'nothing checked off yet. tick a box and it lands here.' : 'to-do list is empty. go outside?'}</div>`;
  list.innerHTML = head + body;
  // wire checkboxes
  $$('.box[data-check]', list).forEach(b => b.onclick = () => {
    const nm = b.dataset.check;
    const a = ASSIGNMENTS.find(x => x.nm===nm);
    if(a.state==='done'){ return; } // already permanently done
    state.asgDone[nm] = !state.asgDone[nm];
    save();
    if(state.asgDone[nm]){
      const c = byId(a.cid);
      toast({ic:'✓', tt:'checked off · '+nm, ts:esc(c.name)+' · moved to Done'});
    }
    // refresh tab counts + list
    refreshAsgTabs();
    renderAsgList();
  });
}
function refreshAsgTabs(){
  const c = counts();
  const map = {todo:c.todo, missing:c.missing, done:c.done};
  $$('#main .tabs button').forEach(b => {
    const ct = $('.ct', b);
    if(ct) ct.textContent = map[b.dataset.atab];
  });
}

  $$('#main .tabs button').forEach(b => b.onclick = () => { state.asgTab = b.dataset.atab; save();

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function viewCalendar(){
  return `
    <div class="pagehd"><h1>Calendar</h1><span class="when">due dates, colored by class</span></div>
    <p class="lead">today's the 22nd. the dots are stuff due. that's it.</p>
    <div class="calbar">
      <div class="navbtn" id="calprev">‹</div>
      <div class="mo" id="calmo"></div>
      <div class="navbtn" id="calnext">›</div>
      <div class="todaybtn" id="caltoday">Today</div>
    </div>
    <div class="calgrid" id="calgrid"></div>
    <div id="caldetail"></div>
    <div class="sticky">
      <div class="ic">📌</div>
      <p>kinda busy thursday btw — French vocab plus the Algebra packet creeping up. maybe start the packet wednesday.</p>
    </div>
    <div class="legend">
      <div class="li"><span class="dd" style="background:#5aa9e6"></span>Algebra</div>
      <div class="li"><span class="dd" style="background:#4fb286"></span>Biology / PE</div>
      <div class="li"><span class="dd" style="background:#ffb454"></span>French</div>
      <div class="li"><span class="dd" style="background:#9b87f2"></span>Drama</div>
      <div class="li"><span class="dd" style="background:#ef6a9b"></span>Literature</div>
    </div>`;
}
function renderCalendar(){
  const grid = $('#calgrid'); if(!grid) return;
  const y = state.calYear, mo = state.calMonth;
  $('#calmo').textContent = `${MONTH_NAMES[mo]} ${y}`;
  const events = CAL_EVENTS[`${y}-${mo}`] || {};
  const first = new Date(y, mo, 1).getDay(); // 0=Sun
  const daysIn = new Date(y, mo+1, 0).getDate();
  const isThisMonth = (y===2026 && mo===5);
  let html = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++) html += `<div class="day out"></div>`;
  for(let d=1; d<=daysIn; d++){
    const ev = events[d];
    const dotcols = ev ? ev.map(e => byId(e.cid).accent) : [];
    const dots = dotcols.length ? `<div class="dots">${dotcols.map(col=>`<span class="dd" style="background:${col}"></span>`).join('')}</div>` : '';
    const cls = ['day'];
    if(isThisMonth && d===TODAY) cls.push('today');
    if(ev){ cls.push('has'); }
    if(state.calSel===d && (CAL_EVENTS[`${y}-${mo}`]||{})[d]) cls.push('sel');
    html += `<div class="${cls.join(' ')}" data-day="${d}"><div class="dn">${d}</div>${dots}</div>`;
  }
  const trailing = (7 - ((first + daysIn) % 7)) % 7;
  for(let i=0;i<trailing;i++) html += `<div class="day out"></div>`;
  grid.innerHTML = html;
  $$('.day.has', grid).forEach(el => el.onclick = () => {
    const d = +el.dataset.day;
    state.calSel = state.calSel===d ? null : d; save();
    renderCalendar(); renderCalDetail();
  });
  renderCalDetail();
}
function renderCalDetail(){
  const wrap = $('#caldetail'); if(!wrap) return;
  const y = state.calYear, mo = state.calMonth, d = state.calSel;
  const events = (CAL_EVENTS[`${y}-${mo}`] || {})[d];
  if(!d || !events){ wrap.innerHTML=''; return; }
  const items = events.map(e => {
    const c = byId(e.cid);
    return `<div class="card dayitem"><span class="dd" style="background:${c.accent}"></span>
      <div class="di-nm">${esc(e.nm)}</div><div class="di-c">${esc(c.short)}</div></div>`;
  }).join('');
  const tail = (mo===5 && d===TODAY) ? "both of these are due today. the 7.3 set and one paragraph for lit."
    : "click another day to see its stuff, or the same one to close.";
  wrap.innerHTML = `<div class="daydetail">
    <div class="ddh">${MONTH_NAMES[mo]} ${d} — ${events.length} thing${events.length>1?'s':''} due</div>
    ${items}
    <div class="bubble tail small" style="margin-top:6px;max-width:420px">${esc(tail)}</div>
  </div>`;
}
function wireCalendar(){
  $('#calprev').onclick = () => { state.calMonth--; if(state.calMonth<0){state.calMonth=11;state.calYear--;} state.calSel=null; save(); renderCalendar(); };
  $('#calnext').onclick = () => { state.calMonth++; if(state.calMonth>11){state.calMonth=0;state.calYear++;} state.calSel=null; save(); renderCalendar(); };
  $('#caltoday').onclick = () => { state.calMonth=5; state.calYear=2026; state.calSel=null; save(); renderCalendar(); };
  renderCalendar();
}

/* ============================================================
   TOAST / PING
   ============================================================ */
function toast({ic,tt,ts,tw}){
  if(!state.notify && tt && !/pings (on|off)/.test(tt)) {
    // respect notifications-off, but always allow the on/off confirmation itself
    return;
  }
  const wrap = $('#toastwrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="ti">${ic}</div><div><div class="tt">${tt}</div>${ts?`<div class="ts">${ts}</div>`:''}${tw?`<div class="tw">${tw}</div>`:''}</div>`;
  wrap.appendChild(el);
  const kill = () => { el.classList.add('out'); setTimeout(()=>el.remove(),300); };
  setTimeout(kill, 4200);
  el.onclick = kill;
}
let pingIdx = 0;
function firePing(){
  const p = PINGS[pingIdx % PINGS.length]; pingIdx++;
  // temporarily ignore notify gate for the explicit "test" action
  const wrap = $('#toastwrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="ti">${p.ic}</div><div><div class="tt">${esc(p.tt)}</div><div class="ts">${esc(p.ts)}</div><div class="tw">Better SGY · just now</div></div>`;
  wrap.appendChild(el);
  const kill = () => { el.classList.add('out'); setTimeout(()=>el.remove(),300); };
  setTimeout(kill, 4200);
  el.onclick = kill;
}

applyTheme();
renderNav();
renderScreen();
</script>
