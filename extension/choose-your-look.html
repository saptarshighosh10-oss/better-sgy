<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose your look · Better SGY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27sgy%27 x1=%270%27 y1=%270%27 x2=%270%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%237c6cfc%27/%3E%3Cstop offset=%271%27 stop-color=%27%235b3df0%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23sgy)%27/%3E%3Cpath d=%27M9 20.5L16 11L23 20.5%27 fill=%27none%27 stroke=%27white%27 stroke-width=%273.2%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#f6f7fb; --bg2:#eef0f8;
    --ink:#171a26; --ink2:#3c4255; --ink3:#7a8194;
    --line:#e3e6f0; --card:#ffffff;
    --indigo:#5b3df0; --violet:#7c6cfc;
    --shadow:0 1px 2px rgba(20,24,48,.05),0 14px 40px -12px rgba(40,30,120,.22);
    --radius:22px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0c0e16; --bg2:#11131f;
      --ink:#f0f1f6; --ink2:#c4c8d6; --ink3:#888fa4;
      --line:#222637; --card:#151826;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 50px -14px rgba(0,0,0,.6);
    }
  }
  html,body{height:100%;}
  body{
    font-family:var(--ui-font,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif);
    /* Flat base color only — the rich, per-edition atmosphere is painted by the
       fixed .skinbg layers below and cross-faded with opacity. */
    background:var(--bg);
    color:var(--ink);
    min-height:100%;
    position:relative;
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    /* Live re-skin: smoothly cross-fade the themed surface as slides change. */
    transition:background-color .55s ease, color .55s ease;
  }

  /* ============================================================
     THEMED BACKDROP — fixed, behind everything, pointer-inert.
     One .skinlayer per edition; the active edition's layer fades
     to opacity:1 while the others fade out. Every edition shares
     the SAME motif — large diagonal SOLID-color wedges — recolored
     to its palette. Bands stay deep/muted so the light foreground
     text on top stays readable and the cards remain the focal point.
     ============================================================ */
  .skinbg{
    position:fixed; inset:0; z-index:-1;
    pointer-events:none; overflow:hidden;
  }
  .skinlayer{
    position:absolute; inset:0;
    opacity:0;
    transition:opacity .6s ease;
    will-change:opacity;
  }
  .reduced .skinlayer{ transition:none; }
  /* The active skin's backdrop is revealed by JS toggling body.skin-<id>. */
  body.skin-apple  .skinlayer[data-skin="apple"],
  body.skin-halo   .skinlayer[data-skin="halo"],
  body.skin-slate  .skinlayer[data-skin="slate"],
  body.skin-forge  .skinlayer[data-skin="forge"],
  body.skin-carbon .skinlayer[data-skin="carbon"]{ opacity:1; }

  /* ============================================================
     ONE SHARED MOTIF FOR EVERY EDITION: big diagonal SOLID-color
     wedges (walnut/oak/honey style), recolored per palette. No
     circles, glow rings, gradient mesh, ghosted "S", blobs, or
     hairline/pinstripe grain — just a few large hard-edged solid
     diagonal bands per the user's "use the stripe for everything".
     The bands are kept deep/muted so the light foreground text on
     top stays high-contrast and readable on every skin.
     ============================================================ */

  /* ---- apple: deep blue / slate-blue diagonal bands (cool) ---- */
  .skinlayer[data-skin="apple"]{
    background:
      linear-gradient(115deg, transparent 0 62%, #1f3a63 62% 100%),
      linear-gradient(115deg, transparent 0 30%, #294a78 30% 62%, transparent 62%),
      linear-gradient(115deg, #16284a 0 30%, transparent 30%),
      #1a3155;
  }
  @media (prefers-color-scheme:dark){
    .skinlayer[data-skin="apple"]{
      background:
        linear-gradient(115deg, transparent 0 62%, #16243f 62% 100%),
        linear-gradient(115deg, transparent 0 30%, #1d3050 30% 62%, transparent 62%),
        linear-gradient(115deg, #0f1b30 0 30%, transparent 30%),
        #111d33;
    }
  }

  /* ---- halo: muted teal / gray-green diagonal bands ---- */
  .skinlayer[data-skin="halo"]{
    background:
      linear-gradient(115deg, transparent 0 62%, #2a5650 62% 100%),
      linear-gradient(115deg, transparent 0 30%, #35655c 30% 62%, transparent 62%),
      linear-gradient(115deg, #1f4640 0 30%, transparent 30%),
      #244b45;
  }
  @media (prefers-color-scheme:dark){
    .skinlayer[data-skin="halo"]{
      background:
        linear-gradient(115deg, transparent 0 62%, #1b3a35 62% 100%),
        linear-gradient(115deg, transparent 0 30%, #234741 30% 62%, transparent 62%),
        linear-gradient(115deg, #142e2a 0 30%, transparent 30%),
        #173430;
    }
  }

  /* ---- slate: grayscale — charcoal / near-black / dark-gray (strictly B&W) ---- */
  .skinlayer[data-skin="slate"]{
    background:
      linear-gradient(115deg, transparent 0 62%, #2b2b2b 62% 100%),
      linear-gradient(115deg, transparent 0 30%, #3a3a3a 30% 62%, transparent 62%),
      linear-gradient(115deg, #161616 0 30%, transparent 30%),
      #242424;
  }
  @media (prefers-color-scheme:dark){
    .skinlayer[data-skin="slate"]{
      background:
        linear-gradient(115deg, transparent 0 62%, #1f1f1f 62% 100%),
        linear-gradient(115deg, transparent 0 30%, #2c2c2c 30% 62%, transparent 62%),
        linear-gradient(115deg, #0c0c0c 0 30%, transparent 30%),
        #161616;
    }
  }

  /* ---- forge (Friendly): warm peach / terracotta / cocoa diagonal bands ---- */
  .skinlayer[data-skin="forge"]{
    background:
      linear-gradient(115deg, transparent 0 62%, #b56a45 62% 100%),
      linear-gradient(115deg, transparent 0 30%, #c97f4e 30% 62%, transparent 62%),
      linear-gradient(115deg, #6e4129 0 30%, transparent 30%),
      #8a4f31;
  }
  @media (prefers-color-scheme:dark){
    .skinlayer[data-skin="forge"]{
      background:
        linear-gradient(115deg, transparent 0 62%, #7c452b 62% 100%),
        linear-gradient(115deg, transparent 0 30%, #8f5536 30% 62%, transparent 62%),
        linear-gradient(115deg, #4d2c1b 0 30%, transparent 30%),
        #5f3722;
    }
  }

  /* ---- carbon: warm wood — walnut / oak / honey diagonal bands ---- */
  .skinlayer[data-skin="carbon"]{
    background:
      linear-gradient(115deg, transparent 0 62%, #9c7333 62% 100%),
      linear-gradient(115deg, transparent 0 30%, #b08a4a 30% 62%, transparent 62%),
      linear-gradient(115deg, #6b4c25 0 30%, transparent 30%),
      #835f2e;
  }
  @media (prefers-color-scheme:dark){
    .skinlayer[data-skin="carbon"]{
      background:
        linear-gradient(115deg, transparent 0 62%, #4a371f 62% 100%),
        linear-gradient(115deg, transparent 0 30%, #5c4626 30% 62%, transparent 62%),
        linear-gradient(115deg, #2c2012 0 30%, transparent 30%),
        #3a2b18;
    }
  }
  /* Themed elements ease between editions. prefers-reduced-motion makes them instant. */
  .tile,.wordmark b,.intro h1,.copy h2,.copy .cta,.arrow,.dotbtn.active,
  .eyebrow,.eyebrow .swatch,.preview,.footnote kbd{
    transition:background .55s ease, background-color .55s ease, color .55s ease,
               border-color .55s ease, box-shadow .55s ease, border-radius .55s ease;
  }
  .reduced body,
  .reduced .tile,.reduced .wordmark b,.reduced .intro h1,.reduced .copy h2,
  .reduced .copy .cta,.reduced .arrow,.reduced .dotbtn.active,.reduced .eyebrow,
  .reduced .eyebrow .swatch,.reduced .preview,.reduced .footnote kbd{
    transition:none !important;
  }

  /* ---------- header ---------- */
  .top{
    display:flex; align-items:center; gap:11px;
    padding:22px clamp(18px,5vw,52px) 0;
  }
  .mark{display:flex;align-items:center;gap:11px;}
  .tile{
    width:34px;height:34px;border-radius:var(--accent-radius,9px);
    background:var(--accent-grad,linear-gradient(160deg,var(--violet),var(--indigo)));
    display:grid;place-items:center;
    box-shadow:0 6px 16px -4px var(--accent-glow,rgba(91,61,240,.5));
    flex:0 0 auto;
  }
  .wordmark{font-weight:700;font-size:15.5px;letter-spacing:-.2px;}
  .wordmark b{color:var(--accent,var(--indigo));}
  @media (prefers-color-scheme:dark){.wordmark b{color:var(--violet);}}

  /* ---------- intro heading ---------- */
  .intro{
    text-align:center;
    padding:clamp(14px,3.4vh,30px) 20px 0;
  }
  .intro h1{
    font-size:clamp(28px,4.6vw,44px);
    letter-spacing:var(--head-tracking,-1.1px); line-height:1.04; font-weight:var(--head-weight,760);
    font-family:var(--head-font,inherit);
  }
  .intro p{
    margin-top:11px; color:var(--ink3);
    font-size:clamp(13.5px,1.6vw,16px); line-height:1.5;
  }
  .intro p b{color:var(--ink2);font-weight:600;}

  /* ---------- carousel ---------- */
  .stage{
    flex:1 1 auto;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center;
    padding:clamp(12px,2.4vh,26px) clamp(12px,4vw,48px) 8px;
    min-height:0;
  }
  .viewport{
    width:100%; max-width:1000px;
    overflow:hidden;
    border-radius:var(--radius);
    touch-action:pan-y;
  }
  .track{
    display:flex;
    transition:transform .5s cubic-bezier(.22,.61,.18,1);
    will-change:transform;
  }
  .reduced .track{transition:none;}

  .slide{
    flex:0 0 100%;
    display:grid;
    grid-template-columns:1.35fr .95fr;
    gap:clamp(18px,3vw,40px);
    align-items:center;
    padding:6px clamp(4px,1.4vw,18px);
  }
  @media (max-width:760px){
    .slide{grid-template-columns:1fr;gap:16px;}
  }

  /* preview frame ("screenshot") */
  .preview{
    position:relative;
    border-radius:16px;
    overflow:hidden;
    background:var(--card);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    aspect-ratio:16/10.2;
    order:1;
  }
  @media (max-width:760px){ .preview{order:0;aspect-ratio:16/9.4;} }
  .preview .browserbar{
    position:absolute;top:0;left:0;right:0;height:30px;
    background:rgba(125,130,150,.08);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:6px;padding:0 12px;z-index:3;
    backdrop-filter:blur(4px);
  }
  .preview .dot{width:9px;height:9px;border-radius:50%;background:#d7dae6;}
  @media (prefers-color-scheme:dark){.preview .dot{background:#39405a;}}
  .preview .dot:nth-child(1){background:#ff5f57;}
  .preview .dot:nth-child(2){background:#febc2e;}
  .preview .dot:nth-child(3){background:#28c840;}
  .preview .clip{
    position:absolute; top:30px; left:0; right:0; bottom:0;
    overflow:hidden;
  }
  /* The iframe is rendered large then scaled down so it reads like a screenshot. */
  .preview iframe{
    position:absolute; top:0; left:0;
    width:1400px; height:1010px;            /* design pixels */
    border:0;
    transform-origin:top left;
    background:var(--card);
    pointer-events:none;                     /* non-interactive */
  }
  .preview .skeleton{
    position:absolute;inset:30px 0 0 0;
    display:grid;place-items:center;
    color:var(--ink3);font-size:13px;
    background:
      linear-gradient(110deg,transparent 30%,rgba(125,130,150,.10) 50%,transparent 70%) ,
      var(--card);
    background-size:220% 100%;
    animation:shimmer 1.5s linear infinite;
    z-index:2;
  }
  .reduced .preview .skeleton{animation:none;}
  @keyframes shimmer{0%{background-position:120% 0;}100%{background-position:-120% 0;}}
  .preview.loaded .skeleton{display:none;}

  /* slide copy */
  .copy{order:0;padding:6px 4px;}
  @media (max-width:760px){ .copy{order:1;text-align:center;} }
  .eyebrow{
    display:inline-flex;align-items:center;gap:7px;
    font-size:11.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
    color:var(--ink3);
    margin-bottom:12px;
  }
  /* Swatch tracks the focused edition's accent (not a fixed inline color),
     so it matches the look being previewed. */
  .eyebrow .swatch{width:13px;height:13px;border-radius:4px;flex:0 0 auto;
    background:var(--accent,var(--indigo));}
  .copy h2{font-size:clamp(24px,3.4vw,34px);letter-spacing:var(--head-tracking,-.7px);font-weight:var(--head-weight,740);line-height:1.05;font-family:var(--head-font,inherit);}
  .copy .desc{margin-top:12px;color:var(--ink2);font-size:clamp(14px,1.7vw,17px);line-height:1.55;max-width:34ch;}
  @media (max-width:760px){ .copy .desc{margin-inline:auto;} }
  .copy .cta{
    margin-top:22px;
    display:inline-flex;align-items:center;gap:9px;
    background:var(--btn-bg,linear-gradient(160deg,var(--violet),var(--indigo)));
    color:var(--btn-ink,#fff);border:var(--btn-border,0);cursor:pointer;
    font-size:15px;font-weight:640;
    padding:13px 22px;border-radius:var(--btn-radius,13px);
    box-shadow:0 8px 22px -8px var(--accent-glow,rgba(91,61,240,.6));
    transition:transform .15s ease,box-shadow .2s ease,filter .2s ease,
               background .55s ease,color .55s ease,border-radius .55s ease;
  }
  .copy .cta:hover{transform:translateY(-1px);box-shadow:0 12px 28px -8px var(--accent-glow,rgba(91,61,240,.7));}
  .copy .cta:active{transform:translateY(0);filter:brightness(.96);}
  .reduced .copy .cta{transition:none;}
  .copy .cta svg{transition:transform .2s ease;}
  .copy .cta:hover svg{transform:translateX(3px);}
  .reduced .copy .cta:hover svg{transform:none;}

  /* ---------- controls ---------- */
  .controls{
    display:flex;align-items:center;justify-content:center;gap:18px;
    padding:10px 16px clamp(20px,4vh,40px);
  }
  .arrow{
    width:44px;height:44px;border-radius:50%;
    border:1px solid var(--line);background:var(--card);
    color:var(--ink);cursor:pointer;
    display:grid;place-items:center;
    box-shadow:0 2px 8px rgba(20,24,48,.06);
    transition:transform .15s ease,border-color .2s ease,background .2s ease;
    flex:0 0 auto;
  }
  .arrow:hover{transform:scale(1.07);border-color:var(--accent,var(--violet));}
  .arrow:active{transform:scale(.96);}
  .reduced .arrow{transition:none;}
  .dots{display:flex;align-items:center;gap:10px;}
  .dotbtn{
    width:9px;height:9px;border-radius:50%;
    border:0;padding:0;cursor:pointer;
    background:var(--line);
    transition:all .25s ease;
  }
  .dotbtn:hover{background:var(--ink3);}
  .dotbtn.active{
    width:26px;border-radius:5px;
    background:var(--accent-grad,linear-gradient(90deg,var(--violet),var(--indigo)));
  }
  .reduced .dotbtn{transition:none;}

  .footnote{
    text-align:center;color:var(--ink3);font-size:12px;
    padding:0 20px clamp(14px,3vh,26px);
  }
  .footnote kbd{
    font:inherit;font-size:11px;
    border:1px solid var(--line);border-radius:5px;
    padding:1px 6px;background:var(--card);color:var(--ink2);
  }
  :focus-visible{outline:2.5px solid var(--accent,var(--violet));outline-offset:3px;border-radius:8px;}

  /* ============================================================
     LIVE RE-SKIN — body gets a .skin-<id> class for the focused
     edition. Each block overrides the themed variables (and a few
     decorative touches that can't be a single var) so the whole
     chooser feels like that edition while you decide.
     ============================================================ */

  /* apple — light, airy, calm blue, system sans */
  body.skin-apple{
    --bg:#f5f7fb; --card:#ffffff; --line:#e6e9f1;
    --ink:#1d1d1f; --ink2:#3a3c42; --ink3:#86868b;
    --accent:#0a84ff;
    --accent-grad:linear-gradient(165deg,#3aa0ff,#0a84ff);
    --accent-glow:rgba(10,132,255,.42);
    --accent-radius:11px;
    --head-tracking:-1.2px; --head-weight:680;
    --glow1:rgba(10,132,255,.12); --glow2:rgba(10,132,255,.07);
    --btn-radius:14px;
    /* CTA + accents adopt this edition's blue (white text reads on blue). */
    --btn-bg:var(--accent-grad); --btn-ink:#fff;
  }

  /* halo — near-white, warm-gray, minimal, single signal accent */
  body.skin-halo{
    --bg:#fafaf9; --card:#ffffff; --line:#ececea;
    --ink:#1f1f1e; --ink2:#4a4a47; --ink3:#9b9b95;
    --accent:#16a394;
    --accent-grad:linear-gradient(165deg,#1fc1af,#13917f);
    --accent-glow:rgba(22,163,148,.30);
    --accent-radius:8px;
    --head-tracking:-.6px; --head-weight:600;
    --glow1:rgba(22,163,148,.07); --glow2:rgba(220,80,70,.05);
    --btn-radius:9px;
    /* CTA + accents adopt this edition's green/teal signal (white text reads on it). */
    --btn-bg:var(--accent-grad); --btn-ink:#fff;
  }

  /* slate — black & white, serif headings, editorial / ruled */
  body.skin-slate{
    --bg:#fbfbfa; --card:#ffffff; --line:#1a1a1a;
    --ink:#0f0f0f; --ink2:#2c2c2c; --ink3:#6b6b6b;
    --accent:#1a1a1a;
    --accent-grad:linear-gradient(165deg,#2a2a2a,#000);
    --accent-glow:rgba(0,0,0,.30);
    --accent-radius:3px;
    --head-font:Georgia,"Times New Roman",'Iowan Old Style',serif;
    --head-tracking:-.4px; --head-weight:700;
    --glow1:rgba(0,0,0,.04); --glow2:rgba(0,0,0,.03);
    --btn-bg:#111; --btn-ink:#fff; --btn-radius:4px;
  }
  body.skin-slate .intro h1{
    padding-bottom:.14em;
    border-bottom:1.5px solid var(--ink);
    display:inline-block;
  }
  body.skin-slate .eyebrow{ border-bottom:1px solid var(--line); padding-bottom:7px; }
  body.skin-slate .preview{ border-width:1.5px; border-radius:4px; }

  /* forge (Friendly) — warm cream paper, rounded, cocoa ink, peach/sage */
  body.skin-forge{
    --bg:#faf3e8; --bg2:#f3e8d6; --card:#fffaf2; --line:#ecddc7;
    --ink:#4a3527; --ink2:#6b513d; --ink3:#a08a72;
    --accent:#e08a52;
    --accent-grad:linear-gradient(165deg,#f0a06a,#dd7a45);
    --accent-glow:rgba(224,138,82,.40);
    --accent-radius:14px;
    --head-tracking:-.4px; --head-weight:720;
    --glow1:rgba(224,138,82,.14); --glow2:rgba(122,158,110,.12); /* peach + sage */
    --btn-radius:18px;
    /* CTA + accents adopt this edition's peach/coral (white text reads on it). */
    --btn-bg:var(--accent-grad); --btn-ink:#fff;
  }
  body.skin-forge .preview{ border-radius:20px; }
  body.skin-forge .arrow{ border-radius:50%; }

  /* carbon — warm wood: walnut/oak/cream, honey-amber, serif (SOLID color) */
  body.skin-carbon{
    --bg:#e9dcc6; --bg2:#dccdb1; --card:#f4ead4; --line:#c9b694;
    --ink:#3a2a1a; --ink2:#5a4226; --ink3:#8c7350;
    --accent:#c8881f;
    --accent-grad:linear-gradient(165deg,#e0a23a,#b9760f);
    --accent-glow:rgba(200,136,31,.42);
    --accent-radius:7px;
    --head-font:'Iowan Old Style',Georgia,"Times New Roman",serif;
    --head-tracking:-.5px; --head-weight:680;
    --glow1:rgba(200,136,31,.16); --glow2:rgba(120,80,40,.14);
    --btn-radius:9px;
    /* CTA + accents adopt this edition's honey-amber (white text reads on it). */
    --btn-bg:var(--accent-grad); --btn-ink:#fff;
    /* SOLID warm wood — no grain/streak lines; the flat --bg walnut shows through */
    --skin-grain:none;
  }
  body.skin-carbon .preview{ box-shadow:0 1px 2px rgba(58,42,26,.12),0 16px 44px -14px rgba(58,42,26,.4); }

  /* ============================================================
     FOREGROUND TEXT CONTRAST — every edition now paints a deep,
     dark diagonal backdrop, so all text that floats directly on it
     must be light and high-contrast on EVERY skin (the per-edition
     re-skin would otherwise leave it dark-on-dark and unreadable).
     A subtle text shadow lifts it off the bands; a soft scrim sits
     behind the slide copy column for extra separation. These rules
     come last so they win over the .skin-* variable overrides.
     ============================================================ */
  body[class*="skin-"]{ color:#f4f6fb; }
  body[class*="skin-"] .wordmark{ color:#f4f6fb; text-shadow:0 1px 6px rgba(0,0,0,.45); }
  body[class*="skin-"] .wordmark b{ color:#ffffff; }

  body[class*="skin-"] .intro h1{
    color:#ffffff;
    text-shadow:0 1px 2px rgba(0,0,0,.35),0 6px 22px rgba(0,0,0,.45);
  }
  body[class*="skin-"] .intro p{
    color:#e7eaf2;
    text-shadow:0 1px 5px rgba(0,0,0,.45);
  }
  body[class*="skin-"] .intro p b{ color:#ffffff; }

  body[class*="skin-"] .eyebrow{
    color:#e4e7f0;
    text-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  body[class*="skin-"] .copy h2{
    color:#ffffff;
    text-shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.42);
  }
  body[class*="skin-"] .copy .desc{
    color:#eceef5;
    text-shadow:0 1px 5px rgba(0,0,0,.45);
  }
  body[class*="skin-"] .footnote{
    color:#dfe2ec;
    text-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  body[class*="skin-"] .footnote kbd{
    background:rgba(255,255,255,.14);
    border-color:rgba(255,255,255,.32);
    color:#ffffff;
    text-shadow:none;
  }

  /* Soft scrim behind the slide copy column so the light text always
     has a calm, slightly darker bed to sit on, regardless of which
     diagonal band falls behind it. Subtle, no hard edge. */
  .copy{ position:relative; z-index:0; }
  body[class*="skin-"] .copy::before{
    content:""; position:absolute; z-index:-1;
    inset:-14px -18px;
    border-radius:18px;
    background:radial-gradient(120% 120% at 30% 35%, rgba(0,0,0,.34), rgba(0,0,0,.14) 70%, transparent 100%);
  }
  @media (max-width:760px){
    body[class*="skin-"] .copy::before{ inset:-12px -14px; }
  }

  /* Slate is strictly black & white — keep its scrim neutral too (already is). */

  /* Slate forces a dark heading underline in its re-skin; on the dark
     backdrop make that rule light so it reads. */
  body.skin-slate .intro h1{ border-bottom-color:#ffffff; }
  body.skin-slate .eyebrow{ border-bottom-color:rgba(255,255,255,.28); }
</style>
</head>
<body>
  <!-- Per-edition themed backdrop. Each layer is painted in CSS and cross-faded
       by opacity as the focused skin changes. Sits behind all content, never
       intercepts pointer events, and stays quiet so the picker is the focus. -->
  <div class="skinbg" aria-hidden="true">
    <div class="skinlayer" data-skin="apple"></div>
    <div class="skinlayer" data-skin="halo"></div>
    <div class="skinlayer" data-skin="slate"></div>
    <div class="skinlayer" data-skin="forge"></div>
    <div class="skinlayer" data-skin="carbon"></div>
  </div>

  <header class="top">
    <div class="mark">
      <span class="tile" aria-hidden="true">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
          <path d="M9 19.5L16 10L23 19.5" fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" transform="translate(-4,-2)"/>
        </svg>
      </span>
      <span class="wordmark">Better <b>SGY</b></span>
    </div>
  </header>

  <section class="intro">
    <h1>Choose your look</h1>
    <p>Five takes on the same Schoology. Pick the one that feels right.<br>
       <b>You can change this any time in Settings.</b></p>
  </section>

  <div class="stage">
    <div class="viewport" id="viewport" aria-roledescription="carousel" aria-label="Choose your look">
      <div class="track" id="track"></div>
    </div>
  </div>

  <div class="controls">
    <button class="arrow" id="prev" aria-label="Previous look">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 5l-7 7 7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="dots" id="dots" role="tablist" aria-label="Looks"></div>
    <button class="arrow" id="next" aria-label="Next look">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <p class="footnote">Use <kbd>←</kbd> <kbd>→</kbd> to browse · swipe on touch · <kbd>Enter</kbd> on a look to choose it</p>

<script>
(function(){
  "use strict";

  var EDITIONS = [
    { id:"apple", name:"Apple",    label:"Apple",
      desc:"Spare and confident. Lots of space, one calm blue.",
      color:"#0a84ff" },
    { id:"halo",  name:"Halo",     label:"Halo",
      desc:"Calm and minimal. Color only where it means something.",
      color:"#16a394" },
    { id:"slate", name:"Slate",    label:"Slate",
      desc:"Black-and-white editorial. Serif, like a printed page.",
      color:"#1a1a1a" },
    { id:"forge", name:"Friendly", label:"Friendly",
      desc:"Warm and chatty. A plain-language note on every grade.",
      color:"#e07a3c" },
    { id:"carbon", name:"Carbon",  label:"Carbon",
      desc:"Warm walnut and honey-amber. Rich, woody, easy on the eyes.",
      color:"#c8881f" }
  ];

  var REDUCED = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (REDUCED) document.body.classList.add("reduced");

  var track = document.getElementById("track");
  var dotsWrap = document.getElementById("dots");
  var viewport = document.getElementById("viewport");
  var current = 0;
  var slides = [];

  // Build slides
  EDITIONS.forEach(function(ed, i){
    var slide = document.createElement("div");
    slide.className = "slide";
    slide.setAttribute("role","group");
    slide.setAttribute("aria-roledescription","slide");
    slide.setAttribute("aria-label", (i+1) + " of " + EDITIONS.length + ": " + ed.label);

    var copy = document.createElement("div");
    copy.className = "copy";

    var eyebrow = document.createElement("span");
    eyebrow.className = "eyebrow";
    // Swatch color comes from the focused skin's --accent (set in CSS),
    // so it always matches the look being previewed.
    eyebrow.innerHTML = '<span class="swatch"></span>' +
      "Look " + (i+1) + " of " + EDITIONS.length;

    var h2 = document.createElement("h2");
    h2.textContent = ed.label;

    var desc = document.createElement("p");
    desc.className = "desc";
    desc.textContent = ed.desc;

    var cta = document.createElement("button");
    cta.className = "cta";
    cta.type = "button";
    cta.innerHTML = "Use this look" +
      '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14M13 6l6 6-6 6" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    cta.addEventListener("click", function(){ choose(ed.id); });

    copy.appendChild(eyebrow);
    copy.appendChild(h2);
    copy.appendChild(desc);
    copy.appendChild(cta);

    // Preview (browser-chrome framed, scaled iframe)
    var preview = document.createElement("div");
    preview.className = "preview";

    var bar = document.createElement("div");
    bar.className = "browserbar";
    bar.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';

    var clip = document.createElement("div");
    clip.className = "clip";

    var skel = document.createElement("div");
    skel.className = "skeleton";
    skel.textContent = "Loading " + ed.label + " preview…";

    var frame = document.createElement("iframe");
    frame.title = ed.label + " preview";
    frame.setAttribute("scrolling","no");
    frame.setAttribute("tabindex","-1");
    frame.setAttribute("aria-hidden","true");
    frame.dataset.src = "./mockup-app-" + ed.id + ".html";
    frame.addEventListener("load", function(){
      if (frame.getAttribute("src")) preview.classList.add("loaded");
    });

    clip.appendChild(frame);
    preview.appendChild(bar);
    preview.appendChild(clip);
    preview.appendChild(skel);

    slide.appendChild(copy);
    slide.appendChild(preview);
    track.appendChild(slide);

    slides.push({ el:slide, preview:preview, frame:frame, clip:clip });

    // Dot
    var dot = document.createElement("button");
    dot.className = "dotbtn";
    dot.type = "button";
    dot.setAttribute("role","tab");
    dot.setAttribute("aria-label", "Go to " + ed.label);
    dot.addEventListener("click", function(){ goTo(i); });
    dotsWrap.appendChild(dot);
  });

  var dotEls = dotsWrap.querySelectorAll(".dotbtn");

  // Scale each iframe so its 1400px design width fits the clip width.
  function rescale(){
    slides.forEach(function(s){
      var w = s.clip.clientWidth;
      if (!w) return;
      var scale = w / 1400;
      s.frame.style.transform = "scale(" + scale + ")";
    });
  }

  // Lazy-load only current + adjacent slides.
  function lazyLoad(){
    slides.forEach(function(s, i){
      var near = Math.abs(i - current) <= 1 ||
                 (current === 0 && i === EDITIONS.length - 1) ||
                 (current === EDITIONS.length - 1 && i === 0);
      if (near && !s.frame.getAttribute("src")) {
        s.frame.setAttribute("src", s.frame.dataset.src);
      }
    });
  }

  var SKIN_CLASSES = EDITIONS.map(function(ed){ return "skin-" + ed.id; });
  function applySkin(){
    var cl = document.body.classList;
    cl.remove.apply(cl, SKIN_CLASSES);
    cl.add("skin-" + EDITIONS[current].id);
  }

  function render(){
    applySkin();
    track.style.transform = "translateX(" + (-current * 100) + "%)";
    for (var i=0;i<dotEls.length;i++){
      var on = (i === current);
      dotEls[i].classList.toggle("active", on);
      dotEls[i].setAttribute("aria-selected", on ? "true" : "false");
    }
    slides.forEach(function(s, i){
      s.el.setAttribute("aria-hidden", i === current ? "false" : "true");
    });
    lazyLoad();
  }

  function goTo(i){
    var n = EDITIONS.length;
    current = ((i % n) + n) % n;
    render();
  }
  function next(){ goTo(current + 1); }
  function prev(){ goTo(current - 1); }

  function choose(id){
    try { localStorage.setItem("bsgy-edition", id); } catch(e){}
    // When embedded in the extension panel, message the parent instead of navigating.
    if (window.parent !== window) {
      window.parent.postMessage({ bsgyChooseLook: id }, "*");
      return;
    }
    // record the chosen edition for the extension (guarded — only if chrome.storage exists)
    try { if (window.chrome && chrome.storage && chrome.storage.local && chrome.storage.local.set) chrome.storage.local.set({ "bsgy-edition": id }); } catch(e){}
    window.location.href = "./mockup-app-" + id + ".html";
  }

  document.getElementById("next").addEventListener("click", next);
  document.getElementById("prev").addEventListener("click", prev);

  // Keyboard
  document.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight"){ next(); e.preventDefault(); }
    else if (e.key === "ArrowLeft"){ prev(); e.preventDefault(); }
    else if (e.key === "Enter" && !/^(BUTTON|A|INPUT)$/.test(document.activeElement.tagName)){
      choose(EDITIONS[current].id);
    }
  });

  // Swipe / drag
  var startX = 0, dragging = false, moved = 0;
  viewport.addEventListener("pointerdown", function(e){
    dragging = true; startX = e.clientX; moved = 0;
    track.style.transition = "none";
  });
  viewport.addEventListener("pointermove", function(e){
    if (!dragging) return;
    moved = e.clientX - startX;
    if (!REDUCED){
      var pct = (moved / viewport.clientWidth) * 100;
      track.style.transform = "translateX(" + (-current * 100 + pct) + "%)";
    }
  });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    track.style.transition = "";
    var threshold = viewport.clientWidth * 0.16;
    if (moved <= -threshold) next();
    else if (moved >= threshold) prev();
    else render();
  }
  viewport.addEventListener("pointerup", endDrag);
  viewport.addEventListener("pointercancel", endDrag);
  viewport.addEventListener("pointerleave", endDrag);

  window.addEventListener("resize", rescale);

  // Init
  render();
  rescale();
  // rescale again after fonts/layout settle
  window.setTimeout(rescale, 60);
  window.setTimeout(rescale, 300);
})();
</script>
</body>
</html>
